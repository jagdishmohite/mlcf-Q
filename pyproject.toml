[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcfq"
version = "0.1.0"
description = "Multi-Layer Coherence Forensics for QUIC/HTTP-3 traffic attribution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jagdish Mohite", email = "jagdish.mohite@gmail.com" }]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
pcap = ["pyshark>=0.6"]
learned = ["numpy>=1.24", "scikit-learn>=1.3"]
capture = ["playwright>=1.40", "aioquic>=1.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "pyshark>=0.6",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "playwright>=1.40",
    "aioquic>=1.0",
]

[project.scripts]
mlcfq = "mlcfq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]

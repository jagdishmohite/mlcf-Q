name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core + dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest --cov=mlcfq --cov-report=term-missing

  test-core-only:
    # Verify the core pipeline (features/scoring/cohort/CLI) works with zero
    # optional dependencies installed — no pyshark, no scikit-learn.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core package only
        run: pip install -e . pytest
      - name: Run tests (excluding pcap-extraction tests)
        run: pytest -k "not pcap"
